<section class="card">
  <header class="card-header">
    <h2>Items</h2>
    <a class="btn btn-primary" routerLink="/items/new">+ New Item</a>
  </header>

  <div class="card-body">
    <div *ngIf="loading()">Loading...</div>
    <div *ngIf="error()" class="error">{{ error() }}</div>

    <div class="table-wrapper" *ngIf="!loading() && !error()">
      <table class="table">
        <thead>
          <tr>
            <th style="width:80px">ID</th>
            <th>Name</th>
            <th>Description</th>
            <th style="width:180px">Created At</th>
            <th style="width:160px">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let it of items(); trackBy: trackById">
            <td>{{ it.id }}</td>
            <td class="text-strong">{{ it.name }}</td>
            <td class="muted">{{ it.description }}</td>
            <td>{{ it.createdAt ? (it.createdAt | date:'medium') : '-' }}</td>
            <td class="actions">
              <a class="btn btn-secondary" [routerLink]="['/items', it.id, 'edit']">Edit</a>
              <button class="btn btn-danger" type="button" (click)="onDelete(it)">Delete</button>
            </td>
          </tr>
          <tr *ngIf="items().length === 0">
            <td colspan="5" class="empty">No items found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
